<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#003346" />
  <title>Session | POM Tutorials</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/auto-render.min.js"></script>
</head>
<body>

  <!-- ─── Site-wide Auth Gate ─── -->
  <div id="auth-gate" class="auth-gate">
    <div class="gate-card">
      <div class="gate-logo">POM <span>Tutorials</span></div>
      <h1>Process &amp; Operations Management</h1>
      <p>INSEAD MBA Tutorial Sessions</p>
      <form id="gate-form" class="gate-form">
        <label for="gate-password" class="sr-only">Tutorial password</label>
        <input type="password" id="gate-password" placeholder="Enter password" autocomplete="off" aria-describedby="gate-error" required />
        <button type="submit" class="btn btn-primary">Enter</button>
      </form>
      <div id="gate-error" class="password-error" role="alert" aria-live="polite"></div>
      <details class="reveal-password">
        <summary>Reveal password</summary>
        <p>The password is <code>pom2026T</code>.</p>
      </details>
    </div>
  </div>

  <!-- ─── App Content (hidden until authenticated) ─── -->
  <div id="app-content" style="display:none">
    <a class="skip-link" href="#session-content">Skip to main content</a>
    <nav class="navbar" aria-label="Primary">
      <div class="nav-inner">
        <a href="index.html" class="nav-brand">POM <span>Tutorials</span></a>
        <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-controls="nav-links" aria-expanded="false">&#9776;</button>
        <ul class="nav-links" id="nav-links"></ul>
      </div>
    </nav>

    <header class="session-hero">
      <div class="container" style="padding-bottom:0">
        <div class="breadcrumb"><a href="index.html">Home</a> &rsaquo; Session</div>
        <h1 id="session-title">Session</h1>
        <p class="subtitle" id="session-subtitle"></p>
      </div>
    </header>

    <main class="session-content" id="session-content" tabindex="-1"></main>

    <footer class="footer">
      INSEAD &mdash; Process &amp; Operations Management Tutorials &middot; Platform developed by Stefanos Poulidis
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
